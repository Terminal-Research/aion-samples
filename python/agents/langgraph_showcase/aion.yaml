aion:
  agents:
    showcase:
      path: "./src/graph.py:create_graph"
      name: "Aion Showcase (LangGraph)"
      description: >-
        Guided tour of the platform features available to an agent:
        streaming, a model answer through the platform's model service, cards,
        artifacts, human-in-the-loop, reactions, explicit A2A responses,
        runtime context, deployment configuration and custom HTTP routes.
        Every other response is written by the agent itself.
      version: "1.0.0"
      # Clients read these to know what they may send and what comes back:
      # files for `attachment`, and the CSV, data and card parts the
      # commands answer with.
      input_modes: [ "text", "image", "application/pdf" ]
      output_modes: [ "text", "text/csv", "json", "application/vnd.aion.card+jsx" ]
      skills:
        - id: "feature_showcase"
          name: "Feature Showcase"
          description: >-
            Each keyword runs one demonstration and answers with the SDK call
            that produced it; add "native" after it to see the same done with
            LangGraph alone. Send "help" for the menu.
          tags: [ "showcase", "streaming", "artifacts", "cards", "a2a" ]
          examples:
            - "help"
            - "stream"
            - "sections"
            - "llm What is the A2A protocol?"
            - "thinking"
            - "card"
            - "artifact"
            - "file"
            - "data"
            - "composite"
            - "ask"
            - "react"
            - "post"
            - "metadata"
            - "progress"
            - "task"
            - "message"
            - "fail"
            - "context"
            - "attachment"
            - "config"
            - "http"
            - "stream native"
            - "sections native"
            - "llm native What is the A2A protocol?"
            - "file native"
            - "ask native"
            - "message native"
            - "fail native"
            - "context native"
            - "attachment native"

      # Filled in per environment by an administrator and delivered with the
      # invocation. The `config` command reads these back.
      configuration:
        greeting:
          type: "string"
          description: "Heading shown at the top of the menu"
          default: "Aion Showcase — LangGraph"
        # An `llm` field is a model id; the control plane offers the catalog
        # for it. No default: whoever deploys the agent picks a model, and
        # `llm` says how to set one until then.
        model:
          type: "llm"
          description: "Model that answers the `llm` command"
