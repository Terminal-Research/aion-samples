aion:
  agents:
    showcase:
      path: "./src/agent.py:create_agent"
      name: "Aion Showcase (ADK)"
      description: >-
        Guided tour of the platform features available to an agent:
        streaming, a model answer through the platform's model service, cards,
        artifacts, human-in-the-loop, reactions, explicit A2A responses,
        runtime context, deployment configuration and custom HTTP routes.
        Every other answer is written by the agent itself. What a command
        produces is the task's result, an artifact; text around it is a message.
      version: "1.0.0"
      input_modes: [ "text" ]
      output_modes: [ "text" ]
      skills:
        - id: "feature_showcase"
          name: "Feature Showcase"
          description: >-
            Each keyword runs one demonstration and names the SDK call that
            produced it. Send "help" for the menu.
          tags: [ "showcase", "streaming", "artifacts", "cards", "a2a", "adk" ]
          examples:
            - "help"
            - "stream"
            - "sections"
            - "llm What is the A2A protocol?"
            - "thinking"
            - "card"
            - "artifact"
            - "file"
            - "data"
            - "composite"
            - "ask"
            - "react"
            - "post"
            - "metadata"
            - "progress"
            - "task"
            - "message"
            - "fail"
            - "context"
            - "attachment"
            - "config"
            - "http"

      # Filled in per environment by an administrator and delivered with the
      # invocation. The `config` command reads these back.
      configuration:
        greeting:
          type: "string"
          description: "Heading shown at the top of the menu"
          default: "Aion Showcase — ADK"
        # An `llm` field is a model id; the control plane offers the catalog
        # for it. No default: whoever deploys the agent picks a model, and
        # `llm` says how to set one until then.
        model:
          type: "llm"
          description: "Model that answers the `llm` command"
