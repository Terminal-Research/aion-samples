aion:
  agents:
    showcase:
      path: "./src/agent.py:create_agent"
      name: "Aion Showcase (ADK)"
      description: >-
        Guided tour of the platform features available to an agent:
        streaming, a model answer through the platform's model service, cards,
        artifacts, multi-turn state, reactions, explicit A2A responses,
        runtime context, deployment configuration and custom HTTP routes.
        Every other response is written by the agent itself.
      version: "1.0.0"
      input_modes: [ "text" ]
      output_modes: [ "text" ]
      skills:
        - id: "feature_showcase"
          name: "Feature Showcase"
          description: >-
            Each keyword runs one demonstration and replies with the SDK call
            that produced it. Send "help" for the menu.
          tags: [ "showcase", "streaming", "artifacts", "cards", "a2a", "adk" ]
          examples:
            - "help"
            - "stream"
            - "llm What is the A2A protocol?"
            - "typing"
            - "card"
            - "file"
            - "data"
            - "composite"
            - "ask"
            - "react"
            - "metadata"
            - "progress"
            - "task"
            - "message"
            - "fail"
            - "context"
            - "config"
            - "http"

      # Filled in per environment by an administrator and delivered with the
      # invocation. The `config` command reads these back.
      configuration:
        greeting:
          type: "string"
          description: "Heading shown at the top of the menu"
          default: "Aion Showcase"
        # An `llm` field is a model id; the control plane offers the catalog
        # for it. The code keeps the same default for turns without an
        # environment — see DEFAULT_MODEL in src/handlers/llm.py.
        model:
          type: "llm"
          description: "Model that answers the `llm` command"
          default: "gpt-5-nano"
