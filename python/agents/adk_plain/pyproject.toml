[tool.poetry]
name = "adk-plain"
version = "1.0.0"
description = "An ADK agent with nothing Aion-specific in it, served as an Aion agent"
authors = ["Terminal Research Team <support@terminal.exchange>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
aionto-sdk = { git = "https://github.com/Terminal-Research/aion-python-sdk", branch = "feat/a2a-result-artifacts", extras = ["adk-server"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
